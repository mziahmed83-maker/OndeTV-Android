name: Build OndeTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare OndeTV launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 --decode app/src/main/ondetv_icon_256.b64 > app/src/main/res/drawable/ondetv_icon.jpg
          rm -f app/src/main/res/drawable/ondetv_icon.jpg.b64
          test -s app/src/main/res/drawable/ondetv_icon.jpg

      - name: Enable artwork rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ondetv/app/ui/OndeTvUi.kt')
          text = path.read_text()
          text = text.replace('MediaRow(', 'ArtworkMediaRow(')
          text = text.replace('private fun ArtworkMediaRow(', 'private fun LegacyMediaRow(')
          path.write_text(text)
          PY
          grep -q 'ArtworkMediaRow(episode)' app/src/main/java/com/ondetv/app/ui/OndeTvUi.kt
          grep -q 'ArtworkMediaRow(item)' app/src/main/java/com/ondetv/app/ui/OndeTvUi.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable à $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OndeTV-artwork-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
