name: Build OndeTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare OndeTV launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 --decode app/src/main/ondetv_icon_256.b64 > app/src/main/res/drawable/ondetv_icon.jpg
          rm -f app/src/main/res/drawable/ondetv_icon.jpg.b64
          test -s app/src/main/res/drawable/ondetv_icon.jpg

      - name: Apply V4 player and radio improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ondetv/app/ui/EnhancedOndeTvUi.kt')
          text = path.read_text()

          text = text.replace(
              'import androidx.compose.material.icons.filled.Rotate90DegreesCcw\n',
              'import androidx.compose.material.icons.filled.Rotate90DegreesCcw\nimport androidx.compose.material.icons.filled.Radio\n'
          )
          text = text.replace(
              'import androidx.media3.ui.CaptionStyleCompat\n',
              'import androidx.media3.ui.AspectRatioFrameLayout\nimport androidx.media3.ui.CaptionStyleCompat\n'
          )

          text = text.replace(
              '    var settingsOpen by remember { mutableStateOf(false) }\n',
              '    var settingsOpen by remember { mutableStateOf(false) }\n    var radioOnly by remember { mutableStateOf(false) }\n    val visibleCategories = if (radioOnly) categories.filter { c ->\n        val n = c.name.lowercase()\n        n.contains("radio") || n.contains("fm") || n.contains("music") || n.contains("musique") || n.contains("audio")\n    } else categories\n'
          )

          text = text.replace(
              '                settingsOpen = false\n                vm.home()\n',
              '                settingsOpen = false\n                radioOnly = false\n                vm.home()\n', 1
          )
          text = text.replace(
              '                playing = null\n                vm.home()\n',
              '                playing = null\n                radioOnly = false\n                vm.home()\n', 1
          )
          text = text.replace(
              '                IconButton(onClick = vm::home) {\n',
              '                IconButton(onClick = { radioOnly = false; vm.home() }) {\n', 1
          )

          old_tabs = '''                SectionCard("TV LIVE", Icons.Filled.LiveTv, kind == "live", Modifier.weight(1f)) { vm.selectKind("live") }
                SectionCard("FILMS", Icons.Filled.Theaters, kind == "vod", Modifier.weight(1f)) { vm.selectKind("vod") }
                SectionCard("SÉRIES", Icons.Filled.VideoLibrary, kind == "series", Modifier.weight(1f)) { vm.selectKind("series") }'''
          new_tabs = '''                SectionCard("TV LIVE", Icons.Filled.LiveTv, kind == "live" && !radioOnly, Modifier.weight(1f)) { radioOnly = false; vm.selectKind("live") }
                SectionCard("FILMS", Icons.Filled.Theaters, kind == "vod", Modifier.weight(1f)) { radioOnly = false; vm.selectKind("vod") }
                SectionCard("SÉRIES", Icons.Filled.VideoLibrary, kind == "series", Modifier.weight(1f)) { radioOnly = false; vm.selectKind("series") }
                SectionCard("RADIO", Icons.Filled.Radio, radioOnly, Modifier.weight(1f)) { radioOnly = true; vm.selectKind("live") }'''
          text = text.replace(old_tabs, new_tabs)

          text = text.replace(
              '                            else -> "Bouquets TV"\n',
              '                            else -> if (radioOnly) "Stations radio" else "Bouquets TV"\n', 1
          )
          text = text.replace('                        items(categories, key = CategoryEntity::categoryId) { category ->', '                        items(visibleCategories, key = CategoryEntity::categoryId) { category ->', 1)
          text = text.replace(
              '                        val title = when (kind) { "vod" -> "Films"; "series" -> "Séries"; else -> "Chaînes" }\n',
              '                        val title = when { radioOnly -> "Radios"; kind == "vod" -> "Films"; kind == "series" -> "Séries"; else -> "Chaînes" }\n', 1
          )

          text = text.replace(
              '    var color by remember { mutableStateOf(prefs.getInt("cc_color", AndroidColor.WHITE)) }\n',
              '    var color by remember { mutableStateOf(prefs.getInt("cc_color", AndroidColor.WHITE)) }\n    var imageMode by remember { mutableStateOf(prefs.getString("image_mode", "fit") ?: "fit") }\n', 1
          )
          text = text.replace(
              '                Text("Sous-titres CC", color = TextMain, fontWeight = FontWeight.Bold, fontSize = 21.sp)\n',
              '''                Text("Lecteur vidéo", color = TextMain, fontWeight = FontWeight.Bold, fontSize = 21.sp)
                Text("Format d'image", color = TextMuted)
                listOf("fit" to "Original / Adapter", "16_9" to "16:9", "4_3" to "4:3", "wide" to "Wide / Étirer", "zoom" to "Zoom plein écran").forEach { (value, label) ->
                    Card(
                        modifier = Modifier.fillMaxWidth().clickable {
                            imageMode = value
                            prefs.edit().putString("image_mode", value).apply()
                        },
                        colors = CardDefaults.cardColors(containerColor = if (imageMode == value) PanelSoft else Panel),
                        shape = RoundedCornerShape(14.dp)
                    ) {
                        Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                            Text(label, color = TextMain, modifier = Modifier.weight(1f))
                            if (imageMode == value) Text("✓", color = Green, fontWeight = FontWeight.Bold)
                        }
                    }
                }
                Text("Sous-titres CC", color = TextMain, fontWeight = FontWeight.Bold, fontSize = 21.sp)
''', 1
          )

          text = text.replace(
              '    var subtitleMenu by remember { mutableStateOf(false) }\n    var landscape by remember { mutableStateOf(false) }\n',
              '    var subtitleMenu by remember { mutableStateOf(false) }\n    var imageMenu by remember { mutableStateOf(false) }\n    var imageMode by remember { mutableStateOf(prefs.getString("image_mode", "fit") ?: "fit") }\n    var landscape by remember { mutableStateOf(false) }\n', 1
          )

          marker = '    Column(Modifier.fillMaxSize().background(Color.Black)) {\n'
          player_prep = '''    val resizeMode = when (imageMode) {
        "wide" -> AspectRatioFrameLayout.RESIZE_MODE_FILL
        "zoom" -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
        else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
    }
    val forcedRatio = when (imageMode) {
        "16_9" -> 16f / 9f
        "4_3" -> 4f / 3f
        else -> null
    }

'''
          text = text.replace(marker, player_prep + marker, 1)

          rotate_marker = '''            IconButton(onClick = { landscape = !landscape }) {
                Icon(Icons.Filled.Rotate90DegreesCcw, contentDescription = "Rotation", tint = if (landscape) TextMain else Green)
            }
'''
          image_menu = '''            Box {
                TextButton(onClick = { imageMenu = true }) { Text("Image", color = Green) }
                DropdownMenu(expanded = imageMenu, onDismissRequest = { imageMenu = false }) {
                    listOf("fit" to "Original", "16_9" to "16:9", "4_3" to "4:3", "wide" to "Wide", "zoom" to "Zoom").forEach { (value, label) ->
                        DropdownMenuItem(
                            text = { Text((if (imageMode == value) "✓ " else "") + label) },
                            onClick = {
                                imageMode = value
                                prefs.edit().putString("image_mode", value).apply()
                                imageMenu = false
                            }
                        )
                    }
                }
            }
''' + rotate_marker
          text = text.replace(rotate_marker, image_menu, 1)

          text = text.replace(
              '                    keepScreenOn = true\n                    subtitleView?.setStyle(',
              '                    keepScreenOn = true\n                    resizeMode = resizeMode\n                    subtitleView?.setStyle(', 1
          )
          text = text.replace(
              '                it.player = player\n                it.subtitleView?.setStyle(',
              '                it.player = player\n                it.resizeMode = resizeMode\n                it.subtitleView?.setStyle(', 1
          )
          text = text.replace(
              '            modifier = Modifier.weight(1f).fillMaxWidth()\n',
              '            modifier = if (forcedRatio != null) Modifier.fillMaxWidth().aspectRatio(forcedRatio) else Modifier.weight(1f).fillMaxWidth()\n', 1
          )

          required = ['Icons.Filled.Radio', 'AspectRatioFrameLayout.RESIZE_MODE_FILL', 'image_mode', 'visibleCategories', 'Stations radio']
          missing = [s for s in required if s not in text]
          if missing:
              raise SystemExit(f'Missing V4 patches: {missing}')
          path.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable à $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OndeTV-v4-rotation-image-radio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
