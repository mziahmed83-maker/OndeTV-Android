name: Build OndeTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare OndeTV launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          base64 --decode app/src/main/ondetv_icon_256.b64 > app/src/main/res/drawable/ondetv_icon.jpg
          rm -f app/src/main/res/drawable/ondetv_icon.jpg.b64
          test -s app/src/main/res/drawable/ondetv_icon.jpg

      - name: Apply V4 playback and radio patch
        run: python3 scripts/v4_patch.py

      - name: Apply V5 premium interface patch
        run: python3 scripts/v5_ui_patch.py

      - name: Apply V6 immersive player patch
        run: python3 scripts/v6_immersive_player_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable OndeTV debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ondetv-debug-signing-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=OndeTV,C=MA"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable à $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OndeTV-v6-immersive-player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
